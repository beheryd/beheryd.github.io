<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>David Behery</title>
    <meta name="description" content="David Behery — a memory palace of questions and loose thoughts.">
    <link rel="shortcut icon" href="dbicon.png" type="image/x-icon">
    <link rel="apple-touch-icon" href="dbicon.png">
    <link rel="icon" href="dbicon.png" type="image/png">
    <!-- Hiragino Sans renders on Apple devices; Noto Sans JP is the fallback everywhere else
         (only downloaded if Hiragino isn't installed). -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;600;800&display=swap">
    <link rel="stylesheet" href="assets/palace.css">
</head>
<body>
    <main id="palace" aria-label="Memory palace">
        <!-- Layers (facade, thought frames, back wall) are built by assets/palace.js -->
        <div id="hall"></div>
    </main>

    <!-- The bio lives here; palace.js moves it onto the entrance plaque and into the reader. -->
    <template id="bio-template">
        <p>I'm currently a <a href="https://kempnerinstitute.harvard.edu/" target="_blank" rel="noopener">Kempner</a> post-bac scholar at Harvard.</p>
        <p>I love learning about all kinds of intelligence— partly just because it's fascinating, and partly to understand what makes us human.</p>
        <p>In my ideation swamp, one thing I've been working on is a project where my collaborators and I begin to classify a new phenomena in mental imagery.</p>
        <p>In the past, I have worked in the <a href="https://www.wedobrainstuff.com/" target="_blank" rel="noopener">Keinath Lab</a> at UIC researching spatial memory and navigation.</p>
        <p>Now I'm working within the <a href="https://gershmanlab.com/index.html" target="_blank" rel="noopener">CCNLab</a> at Harvard.</p>
        <p>Much is in the works, but if you'd like to chat, send me an <a href="mailto:davidbehery@g.harvard.edu">email</a>!</p>
    </template>

    <!-- Shown across the temple front, in the band above the entrance. -->
    <template id="links">
        <a href="https://bsky.app/profile/dahery.bsky.social" target="_blank" rel="noopener">BlueSky</a>
        <a href="https://substack.com/@davidbehery?utm_campaign=unknown&utm_medium=web" target="_blank" rel="noopener">Substack</a>
        <a href="mailto:davidbehery@g.harvard.edu">Email</a>
        <a href="https://scholar.google.com/citations?user=0WcXy_wAAAAJ&hl=en&oi=ao" target="_blank" rel="noopener">Scholar</a>
        <a href="cv.pdf" target="_blank">CV</a>
        <a href="#about">About</a>
    </template>

    <!-- Not shown on screen: a plain list of every thought for keyboard and screen-reader visitors. -->
    <nav id="ledger" class="visually-hidden" aria-label="Every thought in the palace">
        <ol id="ledger-cells"></ol>
    </nav>

    <dialog id="reader" aria-labelledby="reader-title">
        <article class="card" tabindex="-1" autofocus>
            <button type="button" class="card-close" aria-label="Close">×</button>
            <p class="card-meta" id="reader-meta"></p>
            <h2 id="reader-title"></h2>
            <div class="card-body" id="reader-body"></div>
            <footer class="card-reply" id="reader-reply" hidden>
                <p>Have you thought about this too, or know something I should read?</p>
                <a id="reader-reply-link" href="mailto:davidbehery@g.harvard.edu">Send it my way</a>
            </footer>
        </article>
    </dialog>

    <noscript>
        <div class="noscript">
            <h1>David Behery</h1>
            <p>Kempner post-bac scholar at Harvard, working in the CCNLab.</p>
            <p><a href="https://bsky.app/profile/dahery.bsky.social">BlueSky</a> · <a href="https://substack.com/@davidbehery">Substack</a> · <a href="mailto:davidbehery@g.harvard.edu">Email</a> · <a href="https://scholar.google.com/citations?user=0WcXy_wAAAAJ&hl=en&oi=ao">Google Scholar</a> · <a href="cv.pdf">CV</a></p>
        </div>
    </noscript>

    <div id="grain" aria-hidden="true"></div>

    <script src="assets/palace.js" defer></script>
</body>
</html>
